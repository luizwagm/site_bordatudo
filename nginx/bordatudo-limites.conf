# ==========================================================================
#  Zona do limitador de login — Borda Tudo
#  Instalar em /etc/nginx/conf.d/ (o criar_site.sh faz isso).
#
#  POR QUE EM ARQUIVO SEPARADO, e não dentro do bloco do site:
#
#  A zona precisa existir ANTES de qualquer `limit_req zone=<app>_login`. Ela
#  morava no conf do bordatudo.com, e os dois endereços a usam — então, numa
#  subida em que o certificado do domínio do cliente falha (DNS ainda não
#  propagou) e o de trabalho é emitido, o conf do cliente fica na versão
#  provisória, sem a declaração, e o de trabalho referencia uma zona que não
#  existe. Resultado: `nginx -t` falha e o site não sobe — por um motivo que
#  não tem nada a ver com o que se estava fazendo.
#
#  Em conf.d a zona existe sempre, independente de qual bloco de site está
#  ativo no momento.
#
#  12 tentativas por minuto por endereço é folgado para gente e apertado para
#  robô: quem erra a senha tenta três, quatro vezes; script tenta centenas.
#  A trava do próprio aplicativo continua valendo — esta aqui só evita que a
#  requisição chegue a acordar o Node.
# ==========================================================================
limit_req_zone $binary_remote_addr zone=__APP___login:10m rate=12r/m;
